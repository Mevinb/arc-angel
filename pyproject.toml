[project]
name = "arc-angel"
version = "0.1.0"
description = "ARC — personal AI assistant that coordinates LLM routing, computer control, browser automation, email, and an internship search engine"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "openai>=1.30",
    "rich>=13.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
gmail = ["google-api-python-client>=2.100", "google-auth>=2.23", "google-auth-oauthlib>=1.0"]
computer = ["open-interpreter>=0.4"]
browser = ["browser-use>=0.1", "playwright>=1.40"]
dev = ["pytest>=8.0"]
voice = [
    "faster-whisper>=1.0",
    "sounddevice>=0.4",
    "webrtcvad>=2.0",
    "pyttsx3>=2.9",
    "numpy>=1.24",
    "soundfile>=0.12",
]
kokoro = [
    "kokoro>=0.9.2",
    "soundfile>=0.12",
]

[project.scripts]
arc = "arc.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["arc*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
